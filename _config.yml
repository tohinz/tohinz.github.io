title: Tobias Hinz
tagline: Research Scientist @ Meta
description: I work with generative neural networks to model and understand the world around us.
author:
  name: Tobias Hinz
markdown: kramdown

url: "https://www.tobiashinz.com"
baseurl: ""

defaults:
  - scope:
      path: ""
    values:
      layout: "default"
      # Preview image when a page is shared (LinkedIn, Slack, X, ...); posts override this with their thumbnail.
      image: /images/photo.jpg

# Source files kept in the repo but not published on the site
exclude:
  - images/blog/SSL/two_moons.py
  - documents/CV_Tobias_Hinz.ods
  - vendor/
  - node_modules/
  - Gemfile
  - Gemfile.lock

# Share previews: post images are small/square, so use the compact card
twitter:
  card: summary

social:
  name: Tobias Hinz
  links:
    - https://www.linkedin.com/in/tobias-hinz-397881123
    - https://github.com/tohinz

# Jekyll Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-include-cache
  - jekyll-paginate

paginate: 5
paginate_path: "/blog/page:num/"


disqus:
  shortname: https-tohinz-github-io

compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  endings: all
  ignore:
    envs: []
  blanklines: false
  profile: false
  startings: [html, head, body]
